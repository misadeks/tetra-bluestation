# TETRA BlueStation - Mobile Station (MS) configuration
# Camps on / connects to a BS found by scanning the programmed frequency lists.
#
# Radio-style programming: an MS is programmed by DOWNLINK. It does NOT hard-code
# a serving carrier or duplex spacing. Instead it scans the [[frequency_list]]
# carriers, selects the best suitable cell, and adopts that cell's RF / uplink /
# duplex parameters from its own D-MLE-SYNC/SYSINFO at camp time (EN 300 392-2
# cl. 18.4.2). So there is no tx_freq/rx_freq and no [cell_info] RF block here:
#   - initial RX (downlink) center = first [[frequency_list]] scan candidate
#   - uplink (TX) = derived from the camped cell's SYSINFO (unset until camped)

config_version = "0.7"

# Stack operation mode: "Bs" (Base Station), "Ms" (Mobile Station), or "Mon" (Monitor)
stack_mode = "Ms"

# Uncomment to record debug log. Files get large quickly and add system load.
# debug_log = "./verbose_log.txt"

###############################################################################

# PHY layer i/o configuration

[phy_io]

# Input type: set to SoapySdr. May allow for future non-soapy RF backends.
backend = "SoapySdr"

[phy_io.soapysdr]
# No fixed tx_freq/rx_freq for a radio-style MS. The initial RX (downlink) center
# is seeded from the first [[frequency_list]] scan candidate below, and the MLE
# scan/cell-selection engine retunes it at runtime. The uplink (TX) stays unset
# until the MS camps and derives it from the cell's SYSINFO (EN 300 392-2
# cl. 18.4.2.2). To force a specific startup RX carrier you may still set
# tx_freq = <dl_hz>, but it is not required.

ppm_err = 0 # Adjust if your SDR has a non-negligible tuning error

# SDR device selection. Check with SoapySDRUtil --find / --probe.
device = "driver=sx"

# Sample rate. SXceiver defaults to 600kHz.
sample_rate = 600000

# SXceiver antennas.
rx_antenna = "RX"
tx_antenna = "TX"

# RX gains for receiving the BS downlink. Reduce if the front-end overloads
# when close to the BS.
rx_gain_lna = 48.0
rx_gain_pga = 8.0

# TX gains. MS uplink transmission is NOT active in the current receive-only
# build (uplink/registration land in later phases), so these are kept low to
# avoid any accidental drive. Raise them only once uplink TX is implemented
# and you know your MS RF chain (PA MAX 21 on the mixer if using the IT PA).
tx_gain_dac = 0.0
tx_gain_mixer = 0.0

# Optional file i/o (debug):
# dl_input_file = "./dl_input.bin"   # read DL RF samples from file instead of SDR
# ul_rx_file    = "./ul_output.bin"  # save received RF samples to file

###############################################################################

# Network Information - home network (MCC/MNC) the MS belongs to.
[net_info]
# Mobile Country Code (MCC), 10-bit
mcc = 901
# Mobile Network Code (MNC), 14-bit
mnc = 9999

# Cell Information. For a radio-style MS the RF band/carrier/duplex parameters
# are NOT configured here: they are learned over the air from the serving cell's
# own D-MLE-SYNC/SYSINFO once camped (EN 300 392-2 cl. 18.4.2). The MS finds the
# cell by scanning the [[frequency_list]] carriers above. Only non-RF identity
# fields (e.g. location_area) are kept here.
[cell_info]
# Location Area identifier
location_area = 1

# Colour code, distinguishes adjacent cells on the same frequency.
colour_code = 1

###############################################################################

# Duplex-spacing table (OPTIONAL, TS 100 392-15 cl. 6). A programmed radio may
# override the standardized duplex spacing for specific 3-bit duplex indices.
# Each entry is [duplex_index (0-7), spacing_hz]; unlisted indices use the ETSI
# defaults for the operating band. Index 7 has no ETSI default, so we program it
# here to the 9.4 MHz spacing this network uses.
[duplex_table]
overrides = [[7, 9400000]]

###############################################################################

# Mobile Station (MS) identity/affiliation. REQUIRED when stack_mode = "Ms".
[ms]
# Own Individual Short Subscriber Identity (ISSI), 24-bit (1..=16777215).
# CHANGE THIS to your MS's own address before uplink/registration phases.
issi = 1000001

# Subscriber class this MS belongs to (1-16). Checked against the cell's
# advertised subscriber-class bitmask (D-MLE-SYSINFO, EN 300 392-2 18.4.2.2).
subscriber_class = 1

# Group identities (GSSIs) to attach to once registered. Empty = receive-only
# monitoring (no uplink), which matches the current phase.
attach_groups = []

###############################################################################
# CODEPLUG (Plane B, non-standard management structure). Data only: read by the
# management/TNMM UI and (in a later phase) the scan/camp engine. All values map
# to real air-interface elements and are validated against their ETSI ranges.
#
# Radio model: the MS is programmed with a list of TALKGROUPS (the user-
# selectable "channels", organized into FOLDERS), a list of allowed NETWORKS, and
# a set of downlink FREQUENCIES to SCAN. The radio scans those frequencies (or a
# carrier range), finds the strongest suitable serving cell whose network is
# allowed, camps on it, and derives its uplink/duplex from that cell's SYSINFO.
###############################################################################

# Group folders for organizing talkgroups in the UI tree. `order` sets the
# folder's position (ascending; ties broken by name).
[[folder]]
id = "work"
name = "Work"
order = 1

[[folder]]
id = "test"
name = "Test Net"
order = 2

# Talkgroups: the user-selectable groups (GSSI = 24-bit; class_of_usage = 3-bit,
# EN 300 392-2 group identity). `order` sets the position within the folder
# (ascending; ties broken by name).
[[talkgroup]]
gssi = 101
name = "Dispatch"
folder = "work"
class_of_usage = 0
order = 1

[[talkgroup]]
gssi = 102
name = "Ops"
folder = "work"
class_of_usage = 1
order = 2

[[talkgroup]]
gssi = 201
name = "Test 1"
folder = "test"
order = 1

# Allowed networks (codeplug-wide). A cell is only suitable if its MCC/MNC is
# listed here. `priority` picks the preferred network first (ascending). If no
# [[network]] is programmed, only the home MCC/MNC from [net_info] is allowed.
[[network]]
mcc = 901
mnc = 9999
name = "Home"
priority = 0

# Carrier overrides (OPTIONAL): pin extra camp parameters to one specific
# downlink frequency, applied when the scanner lands on it. Program by explicit
# band+carrier (+optional freq_offset) OR by absolute dl_freq (Hz). `colour_code`
# restricts camping to a cell with that colour code; `rx_only` suppresses uplink;
# `custom_duplex_spacing`/`duplex_index` override the derived duplex spacing.
[[carrier_override]]
name = "BS-1"
band = 4
carrier = 1593                      # 439.825 MHz DL
freq_offset = 0
colour_code = 1
duplex_index = 7
custom_duplex_spacing = 9400000
rx_only = true

[[carrier_override]]
name = "BS-2"
dl_freq = 439850000                 # same as band 4 / carrier 1594
rx_only = true

# Frequency lists — the candidate downlink carriers the MS scans to find a serving
# cell. Define one or more named lists; the radio scans ALL lists combined into a
# single candidate set (duplicates removed) and camps on the best suitable cell.
#   mode = "List"  -> scan the explicitly listed frequencies
#   mode = "Range" -> enumerate a carrier range (see [[frequency_list.range]] below)
# A single-frequency "camp on one carrier" setup is just a List with one frequency.
# With no [[frequency_list]] programmed, the MS does not scan.
[[frequency_list]]
name = "primary"
mode = "List"
frequencies = [439825000, 439850000]
dwell_ms = 800

# Range-based list example. Enumerates band 4 carriers from start to stop in `step`
# carrier units (multiples of 25 kHz). Uncomment to add it to the scan set.
# [[frequency_list]]
# name = "band4-sweep"
# mode = "Range"
# dwell_ms = 800
#
# [[frequency_list.range]]
# band = 4
# start_carrier = 1500
# stop_carrier = 1700
# step = 1

