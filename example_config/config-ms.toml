# TETRA BlueStation - Mobile Station (MS) configuration
# Camps on / connects to a BS found by scanning the programmed frequency lists.
#
# Radio-style programming: an MS is programmed by DOWNLINK. It does NOT hard-code
# a serving carrier or duplex spacing. Instead it scans the [[frequency_list]]
# carriers, selects the best suitable cell, and adopts that cell's RF / uplink /
# duplex / identity from its own D-MLE-SYNC/SYSINFO at camp time (EN 300 392-2
# cl. 18.4.2). So there is no tx_freq/rx_freq and NO [cell_info] section here:
#   - initial RX (downlink) center = first [[frequency_list]] scan candidate
#   - uplink (TX), colour code, location area = learned over the air once camped
#
# File layout:
#   1. Global      - config_version, stack_mode
#   2. [phy_io]    - SDR back end
#   3. [net_info]  - home network (MCC/MNC) — shared identity, see note below
#   4. [duplex_table]
#   5. [ms]        - this radio's identity/affiliation (required for MS)
#   6. CODEPLUG    - all Plane B programming grouped together:
#                    settings, networks, frequencies, folders, talkgroups,
#                    gateways, contacts

config_version = "0.7"

# Stack operation mode: "Bs" (Base Station), "Ms" (Mobile Station), or "Mon" (Monitor)
stack_mode = "Ms"

# Uncomment to record debug log. Files get large quickly and add system load.
# debug_log = "./verbose_log.txt"

###############################################################################
# 2. PHY layer i/o configuration
###############################################################################
[phy_io]
# Input type: set to SoapySdr. May allow for future non-soapy RF backends.
backend = "SoapySdr"

[phy_io.soapysdr]
# No fixed tx_freq/rx_freq for a radio-style MS. The initial RX (downlink) center
# is seeded from the first [[frequency_list]] scan candidate below, and the MLE
# scan/cell-selection engine retunes it at runtime. The uplink (TX) stays unset
# until the MS camps and derives it from the cell's SYSINFO (EN 300 392-2
# cl. 18.4.2.2). To force a specific startup RX carrier you may still set
# tx_freq = <dl_hz>, but it is not required.

ppm_err = 0 # Adjust if your SDR has a non-negligible tuning error

# SDR device selection. Check with SoapySDRUtil --find / --probe.
device = "driver=sx"

# Sample rate. SXceiver defaults to 600kHz.
sample_rate = 600000

# SXceiver antennas.
rx_antenna = "RX"
tx_antenna = "TX"

# RX gains for receiving the BS downlink. Reduce if the front-end overloads
# when close to the BS.
rx_gain_lna = 48.0
rx_gain_pga = 8.0

# TX gains. Raise only once you know your MS RF chain (PA MAX 21 on the mixer if
# using the IT PA).
tx_gain_dac = 0.0
tx_gain_mixer = 0.0

# Optional file i/o (debug):
# dl_input_file = "./dl_input.bin"   # read DL RF samples from file instead of SDR
# ul_rx_file    = "./ul_output.bin"  # save received RF samples to file

###############################################################################
# 3. Home network (MCC/MNC).
#
# NOTE: [net_info] is a SHARED, top-level section (BS mode defines a cell with
# it; MS mode uses it as its HOME network identity for registration/TSI and cell
# suitability). It is conceptually part of the MS codeplug, but because it is
# shared with BS mode it lives here rather than under [codeplug]. The codeplug's
# [[network]] list (below) programs ADDITIONAL allowed networks; the home network
# here is always allowed.
###############################################################################
[net_info]
# Mobile Country Code (MCC), 10-bit
mcc = 901
# Mobile Network Code (MNC), 14-bit
mnc = 9999

###############################################################################
# 4. Duplex-spacing table (OPTIONAL, TS 100 392-15 cl. 6). A programmed radio may
# override the standardized duplex spacing for specific 3-bit duplex indices.
# Each entry is [duplex_index (0-7), spacing_hz]; unlisted indices use the ETSI
# defaults for the operating band. Index 7 has no ETSI default, so we program it
# here to the 9.4 MHz spacing this network uses.
###############################################################################
[duplex_table]
overrides = [[7, 9400000]]

###############################################################################
# 5. Mobile Station (MS) identity/affiliation. REQUIRED when stack_mode = "Ms".
###############################################################################
[ms]
# Own Individual Short Subscriber Identity (ISSI), 24-bit (1..=16777215).
# CHANGE THIS to your MS's own address before uplink/registration phases.
issi = 1000001

# Subscriber class this MS belongs to (1-16). Checked against the cell's
# advertised subscriber-class bitmask (D-MLE-SYSINFO, EN 300 392-2 18.4.2.2).
subscriber_class = 1

# Group identities (GSSIs) to attach to once registered. Empty = receive-only
# monitoring (no uplink).
attach_groups = []

###############################################################################
# 6. CODEPLUG (Plane B, non-standard management structure). Data only: read by
# the management/TNMM UI and the scan/camp engine. All values map to real
# air-interface elements and are validated against their ETSI ranges.
#
# Radio model: the MS is programmed with codeplug-wide SETTINGS, a list of
# allowed NETWORKS, downlink FREQUENCIES to SCAN (+ optional per-carrier
# overrides), a set of user-selectable TALKGROUPS organized into FOLDERS, plus a
# phone book (GATEWAYS + CONTACTS). The radio scans the frequencies, camps on the
# best suitable cell whose network is allowed, and derives RF/uplink over the air.
#
# Everything from here to the end of the file is the codeplug.
###############################################################################

# --- 6.1 Codeplug-wide settings / feature toggles (scalar) ------------------
[codeplug]

# Home-mode display: a status/text message shown on another radio's home screen.
# `enabled` toggles the feature; `pid` is the 8-bit SDS protocol identifier
# (ETSI TS 100 392-2 cl. 29.4.3.9) used for it — 130 (0x82) = Text Messaging with
# SDS-TL. Data only (read by the UI when composing a home-display message).
[codeplug.home_display]
enabled = true
pid = 130

# --- 6.2 Allowed networks ----------------------------------------------------
# A cell is only suitable if its MCC/MNC is listed here (or equals the home
# network in [net_info], which is always allowed). `priority` picks the preferred
# network first (ascending).
[[network]]
mcc = 901
mnc = 9999
name = "Home"
priority = 0

# --- 6.3 Frequency lists (downlink carriers to scan) -------------------------
# Define one or more named lists; the radio scans ALL lists combined into a
# single candidate set (duplicates removed) and camps on the best suitable cell.
#   mode = "List"  -> scan the explicitly listed frequencies
#   mode = "Range" -> enumerate a carrier range (see [frequency_list.range] below)
# With no [[frequency_list]] programmed, the MS does not scan.
[[frequency_list]]
name = "primary"
mode = "List"
frequencies = [439825000, 439850000]
dwell_ms = 800

# Range-based list example (uncomment to add to the scan set). The range is a
# single-bracket sub-table (one range per list), NOT a [[...]] array of tables.
# `offsets` (Hz) probes carrier offsets; TETRA allows only 0, 6250, -6250, 12500.
# [[frequency_list]]
# name = "band4-sweep"
# mode = "Range"
# dwell_ms = 800
#
# [frequency_list.range]
# band = 4
# start_carrier = 1500
# stop_carrier = 1700
# step = 1
# offsets = [0, 6250, 12500]

# --- 6.4 Carrier overrides (OPTIONAL) ----------------------------------------
# Pin extra camp parameters to one specific downlink frequency, applied when the
# scanner lands on it. Program by explicit band+carrier (+optional freq_offset)
# OR by absolute dl_freq (Hz). `colour_code` restricts camping to a cell with
# that colour code; `rx_only` suppresses uplink; `custom_duplex_spacing`/
# `duplex_index` override the derived duplex spacing.
[[carrier_override]]
name = "BS-1"
band = 4
carrier = 1593                      # 439.825 MHz DL
freq_offset = 0
colour_code = 1
duplex_index = 7
custom_duplex_spacing = 9400000
rx_only = true

[[carrier_override]]
name = "BS-2"
dl_freq = 439850000                 # same as band 4 / carrier 1594
rx_only = true

# --- 6.5 Folders (UI grouping of talkgroups) ---------------------------------
# `order` sets the folder's position (ascending; ties broken by name).
[[folder]]
id = "work"
name = "Work"
order = 1

[[folder]]
id = "test"
name = "Test Net"
order = 2

# --- 6.6 Talkgroups (user-selectable groups) ---------------------------------
# GSSI = 24-bit; class_of_usage = 3-bit (EN 300 392-2 group identity). `order`
# sets the position within the folder (ascending; ties broken by name).
[[talkgroup]]
gssi = 101
name = "Dispatch"
folder = "work"
class_of_usage = 0
order = 1

[[talkgroup]]
gssi = 102
name = "Ops"
folder = "work"
class_of_usage = 1
order = 2

[[talkgroup]]
gssi = 201
name = "Test 1"
folder = "test"
order = 1

# --- 6.7 Scan lists (OPTIONAL) -----------------------------------------------
# Named sets of talkgroups the MS affiliates to together (cl. 16.8.2). Each GSSI
# must be a talkgroup above. `active` is the programmed default (toggleable live
# from the UI). Uncomment to program one.
# [[scanlist]]
# name = "Work"
# talkgroups = [101, 102]
# active = true
# order = 1

# --- 6.8 Gateways (external-network PABX/PSTN access points) ------------------
# A phone contact reaches the external network via an ordinary individual call to
# the gateway's `gateway_issi` (CPTI = SSI) that also carries the dialled digits
# in the External subscriber number IE (ETSI TS 100 392-2 cl. 14.8.20). There is
# no PABX/PSTN "type": TETRA carries no on-air distinction — both are ordinary
# external-number calls. `prefix` (optional) is prepended to the number before it
# is placed in the IE (an operator access code).
[[gateway]]
id = "pstn"
name = "Public Phone"
gateway_issi = 8000001

[[gateway]]
id = "office-pabx"
name = "Office PABX"
gateway_issi = 8000002
prefix = "9"                         # dial 9 for an outside line

# --- 6.9 Contacts (phone book) -----------------------------------------------
# Each entry is EITHER an on-network individual (`issi`) OR an external number
# (`number` + `gateway`). `callsign` is optional.
[[contact]]
name = "Dispatch Lead"
callsign = "ALPHA1"
issi = 2000123
order = 1

[[contact]]
name = "Front Desk"
number = "1234"
gateway = "office-pabx"
order = 2

[[contact]]
name = "Emergency"
number = "112"
gateway = "pstn"
order = 3
